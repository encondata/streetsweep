# StreetSweep v2. `docker compose up -d --build` from this folder.
# Runs beside v1 (tools/, port 8420): different container names, port and data folder.
name: streetsweep-v2

x-app-env: &app-env
  DATABASE_URL: postgres://streetsweep:${POSTGRES_PASSWORD:-streetsweep}@db:5432/streetsweep
  TIMEZONE: ${TIMEZONE:-America/Chicago}
  # Only the worker talks to these. The api never calls out.
  # Drive matching. The private Valhalla below; https://valhalla.streetsweep.net is the
  # same thing behind the reverse proxy for anything outside this compose project.
  VALHALLA_URL: ${VALHALLA_URL:-http://valhalla:8002}
  OVERPASS_URL: ${OVERPASS_URL:-}
  # Empty = Texas (https://download.geofabrik.de/north-america/us/texas-latest.osm.pbf).
  OSM_EXTRACT_URL: ${OSM_EXTRACT_URL:-}
  # Sent in the User-Agent to Geofabrik, OpenStreetMap and Esri, as their usage policies ask.
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  TILE_URL_OSM: ${TILE_URL_OSM:-}
  TILE_TTL_DAYS: ${TILE_TTL_DAYS:-30}
  DATA_DIR: /data

services:
  db:
    # Multi-arch PostGIS (postgis/postgis is amd64 only). Same layout as the official image.
    image: ${POSTGIS_IMAGE:-imresamu/postgis:16-3.5}
    container_name: streetsweep2-db
    environment:
      POSTGRES_USER: streetsweep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-streetsweep}
      POSTGRES_DB: streetsweep
    volumes:
      # DATA_DIR (in .env) should be outside any file-synced folder: a live database must
      # never be file-synced. No nested defaults anywhere: older Compose (Unraid's) can't
      # read them.
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetsweep -d streetsweep"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    image: streetsweep/v2
    container_name: streetsweep2-api
    command: ["node", "dist/api.js"]
    environment:
      <<: *app-env
      PORT: "80"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Outgoing mail (sign-up codes, password resets). Defaults to the Mailpit below;
      # for real mail set SMTP_HOST/PORT/SECURE/USER/PASS and MAIL_FROM in .env.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-StreetSweep <no-reply@streetsweep.local>}
    volumes:
      - ${DATA_DIR:-./data}/files:/data
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8430}:80"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Development mail catcher: every email the app sends lands here instead of a real
  # inbox. Read them at http://localhost:8025 (MAILPIT_UI_PORT). Nothing is relayed out.
  mailpit:
    image: axllent/mailpit:latest
    container_name: streetsweep2-mailpit
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_MAX_MESSAGES: 2000
    restart: unless-stopped

  worker:
    image: streetsweep/v2
    container_name: streetsweep2-worker
    command: ["node", "dist/worker.js"]
    environment:
      <<: *app-env
    volumes:
      - ${DATA_DIR:-./data}/files:/data
    depends_on:
      # The api applies migrations on start; the worker waits for it to be healthy.
      api:
        condition: service_healthy
    restart: unless-stopped

  # Private Valhalla for matching drives to streets. It builds its routing tiles from the
  # .osm.pbf in its folder: on first start, copy (or hard-link) the worker's download,
  #   ln $DATA_DIR/files/osm/texas.osm.pbf $DATA_DIR/valhalla/texas.osm.pbf
  # or set VALHALLA_PBF_URL to have it download one. The first build takes an hour or so;
  # drives wait in the queue until it answers. Port 8002 for the reverse proxy
  # (valhalla.streetsweep.net).
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: streetsweep2-valhalla
    # A ceiling, so a hungry build stops this container rather than the whole Docker VM
    # (which took every container down with it once). Raise VALHALLA_MEMORY if it's killed.
    mem_limit: ${VALHALLA_MEMORY:-4g}
    ports:
      - "${VALHALLA_BIND_ADDRESS:-127.0.0.1}:${VALHALLA_PORT:-8002}:8002"
    environment:
      tile_urls: ${VALHALLA_PBF_URL:-}
      use_tiles_ignore_pbf: "True"
      build_elevation: "False"
      build_admins: "False"
      build_time_zones: "False"
      # Two threads keeps the first build (and its memory) within a laptop's Docker VM.
      server_threads: ${VALHALLA_THREADS:-2}
    volumes:
      - ${DATA_DIR:-./data}/valhalla:/custom_files
    restart: unless-stopped
