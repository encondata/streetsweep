services:
  db:
    image: postgres:16-alpine
    container_name: streetsweep-db
    environment:
      POSTGRES_USER: streetsweep
      POSTGRES_PASSWORD: streetsweep
      POSTGRES_DB: streetsweep
    volumes:
      - areas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetsweep -d streetsweep"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    image: streetsweep/area-builder
    container_name: streetsweep-area-builder
    environment:
      DATABASE_URL: postgres://streetsweep:streetsweep@db:5432/streetsweep
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Where the server fetches streets from. Empty uses the public Overpass servers;
      # set it to your own instance, or several separated by commas.
      OVERPASS_URL: ${OVERPASS_URL:-}
      # Where Sunday, early-morning and after-midnight achievements are measured.
      TIMEZONE: ${TIMEZONE:-America/Chicago}
      # Photos attached to marked places. A directory on the volume below: they are
      # large, read rarely, and nothing joins against them, so object storage was only
      # ever a second container holding files this one already streams out itself.
      PHOTO_DIR: /data/photos
      # Map tiles, fetched from OpenStreetMap (and Esri, for satellite) once and kept here
      # for every browser and phone. TILE_URL_OSM points the standard map at your own tile
      # server instead, e.g. http://tiles.local/{z}/{x}/{y}.png.
      TILE_DIR: /data/tiles
      TILE_TTL_DAYS: ${TILE_TTL_DAYS:-30}
      TILE_URL_OSM: ${TILE_URL_OSM:-}
    volumes:
      # Deliberately not photo-data. That volume holds MinIO's own layout —
      # .minio.sys and the bucket directory — and mounting it here would leave the
      # photos tangled up with the thing they were moved out of: no way to reclaim
      # the old space without deleting the new files, and a storage count that
      # includes MinIO's bookkeeping. photo-data is kept below, untouched, so it can
      # be dropped in one go once migrate-photos.js has run.
      - photo-files:/data/photos
      - tile-cache:/data/tiles
    # Plain HTTP for a reverse proxy in front to forward to. Set BIND_ADDRESS to
    # 127.0.0.1 in .env when that proxy runs on this same host.
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8420}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  areas-data:
  photo-files:
  tile-cache:
  # The old MinIO data. Nothing mounts it any more; it is declared so Compose does
  # not treat it as an orphan, and so removing it stays a deliberate act:
  #   docker compose down && docker volume rm tools_photo-data
  photo-data:
