services:
  db:
    image: postgres:16-alpine
    container_name: streetsweep-db
    environment:
      POSTGRES_USER: streetsweep
      POSTGRES_PASSWORD: streetsweep
      POSTGRES_DB: streetsweep
    volumes:
      # Everything the server keeps lives in plain folders under DATA_DIR (../data, beside
      # the code: /mnt/user/streetsweep/data on Unraid), not in Docker's own volumes, so it
      # sits on the array, is backed up with it, and does not fill docker.img. Postgres is
      # happier on a cache-only share; point DATA_DIR there (e.g. /mnt/cache/streetsweep)
      # if the array is slow.
      - ${DATA_DIR:-../data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streetsweep -d streetsweep"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    image: streetsweep/area-builder
    container_name: streetsweep-area-builder
    environment:
      DATABASE_URL: postgres://streetsweep:streetsweep@db:5432/streetsweep
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Where the server fetches streets from. Empty uses the public Overpass servers;
      # set it to your own instance, or several separated by commas.
      OVERPASS_URL: ${OVERPASS_URL:-}
      # Where Sunday, early-morning and after-midnight achievements are measured.
      TIMEZONE: ${TIMEZONE:-America/Chicago}
      # Photos attached to marked places. A directory on the volume below: they are
      # large, read rarely, and nothing joins against them, so object storage was only
      # ever a second container holding files this one already streams out itself.
      PHOTO_DIR: /data/photos
      # Map tiles, fetched from OpenStreetMap (and Esri, for satellite) once and kept here
      # for every browser and phone. TILE_URL_OSM points the standard map at your own tile
      # server instead, e.g. http://tiles.local/{z}/{x}/{y}.png.
      TILE_DIR: /data/tiles
      TILE_TTL_DAYS: ${TILE_TTL_DAYS:-30}
      TILE_URL_OSM: ${TILE_URL_OSM:-}
      # Where drives are matched to streets: the Valhalla below, through the reverse proxy.
      # While it is not answering (its first start builds routing tiles for an hour or
      # more) drives go to the public server instead; VALHALLA_FALLBACK_URL=none stops that.
      VALHALLA_URL: ${VALHALLA_URL:-https://valhalla.hackspacelabs.com}
      VALHALLA_FALLBACK_URL: ${VALHALLA_FALLBACK_URL:-}
      # A Geofabrik extract to fill the street store from, once a month, instead of asking
      # Overpass cell by cell, e.g.
      #   https://download.geofabrik.de/north-america/us/texas-latest.osm.pbf
      # Empty keeps using Overpass. Cells outside the file still come from Overpass.
      OSM_EXTRACT_URL: ${OSM_EXTRACT_URL:-}
      OSM_EXTRACT_DIR: /data/osm
    volumes:
      - ${DATA_DIR:-../data}/photos:/data/photos
      - ${DATA_DIR:-../data}/tiles:/data/tiles
      - ${DATA_DIR:-../data}/osm:/data/osm
    # Plain HTTP for a reverse proxy in front to forward to. Set BIND_ADDRESS to
    # 127.0.0.1 in .env when that proxy runs on this same host.
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8420}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # A Valhalla of your own, built from a Geofabrik extract, so matching drives never
  # touches the public server. Published on port 8002 for the reverse proxy in front
  # (valhalla.hackspacelabs.com). The first start downloads the extract and builds routing
  # tiles — for Texas, about 700 MB to download, several GB of disk and an hour or more;
  # later starts reuse them. Watch it with: docker compose logs -f valhalla
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:latest
    container_name: streetsweep-valhalla
    ports:
      - "${VALHALLA_BIND_ADDRESS:-0.0.0.0}:${VALHALLA_PORT:-8002}:8002"
    environment:
      tile_urls: ${VALHALLA_PBF_URL:-https://download.geofabrik.de/north-america/us/texas-latest.osm.pbf}
      use_tiles_ignore_pbf: "True"
      build_elevation: "False"
      build_admins: "False"
      build_time_zones: "False"
      server_threads: ${VALHALLA_THREADS:-4}
    volumes:
      - ${DATA_DIR:-../data}/valhalla:/custom_files
    restart: unless-stopped

# No named volumes: see DATA_DIR above. An install from before kept its data in Docker
# volumes (tools_areas-data and the rest); install.sh copies them into DATA_DIR once and
# leaves the old volumes alone, to be removed by hand when the move has been checked.
